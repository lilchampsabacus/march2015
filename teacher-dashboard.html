<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Li'l Champs Abacus</title>
<style>body{font-family:Arial,sans-serif;background:#f0f9ff;margin:0}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#4338ca;font-weight:700}</style>
</head>
<body>
<div class="loading">Loading dashboard...</div>
<script>
(async function(){
  try {
    const res = await fetch('teacher-dashboard-base.html?v=1', { cache: 'no-store' });
    if (!res.ok) throw new Error('Dashboard source could not be loaded.');
    let html = await res.text();

    const pattern = /(<div id="admin-controls"[\s\S]*?<div class="flex gap-2">)/;
    const link = '<a href="student-level-management.html" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-purple-700 transition">🎓 Student Levels</a>';
    if (pattern.test(html)) {
      html = html.replace(pattern, '$1' + link);
    }

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = '<div class="loading">Unable to load dashboard. Please refresh the page.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
