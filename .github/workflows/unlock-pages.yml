name: Unlock stuck GitHub Pages deployment

on:
  push:
    paths:
      - '.github/workflows/unlock-pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/7672d3754685f79027c2a3ac65b8744038fa55dc/cancel"
