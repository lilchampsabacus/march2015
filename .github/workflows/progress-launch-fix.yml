name: Progress launch date fix
on:
  push:
    paths: ['.github/workflows/progress-launch-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('student-progress.html')
          s=p.read_text()
          s=s.replace("const SECTION_NAMES={plusminus:'Plus & Minus',multiplication:'Multiplication',division:'Division'};", "const SECTION_NAMES={plusminus:'Plus & Minus',multiplication:'Multiplication',division:'Division'};\nconst DAILY_PRACTICE_LAUNCH='2026-09-10';", 1)
          s=s.replace("function renderAll(){const eligible=diffDays(currentStart,currentEnd);", "function renderAll(){const eligibleStart=currentStart<DAILY_PRACTICE_LAUNCH?DAILY_PRACTICE_LAUNCH:currentStart;const eligible=currentEnd<DAILY_PRACTICE_LAUNCH?0:diffDays(eligibleStart,currentEnd);", 1)
          s=s.replace("document.getElementById('practiceDays').textContent=`${completed.length} / ${eligible}`;document.getElementById('practiceRate').textContent=`${practiceRate}%`;", "document.getElementById('practiceDays').textContent=eligible?`${completed.length} / ${eligible}`:'—';document.getElementById('practiceRate').textContent=eligible?`${practiceRate}%`:'—';", 1)
          s=s.replace("if(d>today){cls='future';word='Future';dot='bg-slate-300'}", "if(d<DAILY_PRACTICE_LAUNCH){cls='future';word='Not tracked';dot='bg-slate-300'}else if(d>today){cls='future';word='Future';dot='bg-slate-300'}", 1)
          s=s.replace("const box=document.getElementById('observation'),items=[];if(rate>=90)", "const box=document.getElementById('observation'),items=[];if(currentEnd<DAILY_PRACTICE_LAUNCH)items.push(['ℹ️','Tracking period',`Daily Practice tracking started ${fmtDate(DAILY_PRACTICE_LAUNCH)}.`,'blue']);else if(rate>=90)", 1)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student-progress.html
          git diff --cached --quiet && exit 0
          git commit -m 'Count Daily Practice only from tracking launch'
          git push
