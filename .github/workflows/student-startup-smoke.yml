name: Student startup performance regression checks

on:
  push:
    branches:
      - 'perf/**'
  pull_request:
    paths:
      - 'practice_options.html'
      - 'login.html'
      - 'daily-practice.js'
      - 'level-access.js'
      - 'level-page-loader.js'
      - 'plus-minus-access.js'
      - 'low-level-access.js'
      - 'daily-card.js'
      - 'class-updates.js'
      - '*-base.html'
      - '*.html'
      - 'scripts/build-practice-pages.cjs'
      - 'tests/practice-loading.cjs'
      - 'tests/student-startup-smoke.cjs'

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify student entry flow and practice patterns
        run: node tests/student-startup-smoke.cjs
      - name: Verify direct practice pages and request sharing
        run: |
          node scripts/build-practice-pages.cjs --check
          node tests/practice-loading.cjs
