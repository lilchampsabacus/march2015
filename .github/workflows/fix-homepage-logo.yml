name: Fix homepage logo path

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-logo.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use exact uploaded PNG logo on homepage
        shell: bash
        run: |
          test -f lil-champs-logo.png
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'lil-champs-logo.svg'
          new = 'lil-champs-logo.png?v=20260912'
          if old not in s:
              raise SystemExit('Expected SVG logo reference was not found in index.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('Replaced', s.count(old), 'logo reference(s).')
          PY

      - name: Commit homepage logo fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use exact uploaded PNG logo on homepage"
          git push
