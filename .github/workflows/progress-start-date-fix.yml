name: Progress start date fix

on:
  push:
    paths:
      - '.github/workflows/progress-start-date-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clamp progress dates to Daily Practice launch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('student-progress.html')
          s = p.read_text()

          new_set_range = """function setRange(kind){const today=indiaISO();let start,end=today;if(kind==='7')start=addDays(today,-6);else if(kind==='30')start=addDays(today,-29);else if(kind==='month'){const d=parseISO(today);start=isoLocal(new Date(d.getFullYear(),d.getMonth(),1))}else if(kind==='prev'){const d=parseISO(today);const last=new Date(d.getFullYear(),d.getMonth(),0);end=isoLocal(last);start=isoLocal(new Date(last.getFullYear(),last.getMonth(),1))}if(start<DAILY_PRACTICE_LAUNCH)start=DAILY_PRACTICE_LAUNCH;if(end<DAILY_PRACTICE_LAUNCH)end=DAILY_PRACTICE_LAUNCH;currentStart=start;currentEnd=end;document.getElementById('fromDate').value=start;document.getElementById('toDate').value=end;loadRange()}"""
          s, n = re.subn(r"function setRange\(kind\)\{.*?\}\nasync function loadRange", new_set_range + "\nasync function loadRange", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace setRange')

          old_load = "async function loadRange(){const today=indiaISO();if(currentEnd>today)currentEnd=today;if(!currentStart||!currentEnd||currentStart>currentEnd)return;"
          new_load = "async function loadRange(){const today=indiaISO();if(currentStart<DAILY_PRACTICE_LAUNCH)currentStart=DAILY_PRACTICE_LAUNCH;if(currentEnd>today)currentEnd=today;if(currentEnd<DAILY_PRACTICE_LAUNCH)currentEnd=DAILY_PRACTICE_LAUNCH;document.getElementById('fromDate').value=currentStart;document.getElementById('toDate').value=currentEnd;if(!currentStart||!currentEnd||currentStart>currentEnd)return;"
          if old_load not in s:
              raise SystemExit('Could not find loadRange header')
          s = s.replace(old_load, new_load, 1)

          marker = "profile=p.data;document.getElementById('studentName').textContent=profile.full_name||'Student';"
          insert = "profile=p.data;const today=indiaISO();const fromInput=document.getElementById('fromDate'),toInput=document.getElementById('toDate');fromInput.min=DAILY_PRACTICE_LAUNCH;fromInput.max=today;toInput.min=DAILY_PRACTICE_LAUNCH;toInput.max=today;const td=parseISO(today),prevLast=isoLocal(new Date(td.getFullYear(),td.getMonth(),0)),prevBtn=document.querySelector('.chip[data-range=\"prev\"]');if(prevBtn&&prevLast<DAILY_PRACTICE_LAUNCH){prevBtn.disabled=true;prevBtn.classList.add('opacity-50','cursor-not-allowed');prevBtn.title='No Daily Practice data exists before 10 Sep 2026';}document.getElementById('studentName').textContent=profile.full_name||'Student';"
          if marker not in s:
              raise SystemExit('Could not find init marker')
          s = s.replace(marker, insert, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-progress.html
          git diff --cached --quiet && exit 0
          git commit -m "Start progress ranges from Daily Practice launch date"
          git push
