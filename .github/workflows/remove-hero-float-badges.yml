name: Remove homepage hero floating badges

on:
  push:
    paths:
      - '.github/workflows/remove-hero-float-badges.yml'

permissions:
  contents: write

jobs:
  remove-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove Daily Practice Habit and Track badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('        <div class="float-card float-a"><b>Daily</b>Practice habit</div>\n', '')
          s = s.replace('        <div class="float-card float-b"><b>Track</b>Score • Time • Errors</div>\n', '')
          p.write_text(s)
          PY

      - name: Commit homepage cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed"
          else
            git commit -m "Remove hero floating badges from homepage"
            git push origin main
          fi
