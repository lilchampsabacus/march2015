name: Rename Practice Report card

on:
  push:
    paths:
      - '.github/workflows/rename-practice-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clarify old report card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('practice_options-base.html')
          s=p.read_text()
          s=s.replace('>My Report</h4>','>Practice Report</h4>',1)
          s=s.replace('>View your practice history and scores.</p>','>View other website practice records and scores.</p>',1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practice_options-base.html
          git diff --cached --quiet && exit 0
          git commit -m "Rename My Report card to Practice Report"
          git push
