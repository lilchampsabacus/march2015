<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Options | Li'l Champs</title>
<style>body{font-family:Arial,sans-serif;background:#f0f9ff;margin:0}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#4338ca;font-weight:700}</style>
</head>
<body>
<div class="loading">Loading practice dashboard...</div>
<script>
(async function(){
  try {
    const res = await fetch('practice_options-base.html?v=1', { cache: 'no-store' });
    if (!res.ok) throw new Error('Practice dashboard source could not be loaded.');
    let html = await res.text();

    html = html.replace('</head>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script></head>');

    const nameBlock = '<div id="welcome-name" class="text-xl font-bold text-white">Welcome!</div>';
    const levelBlock = nameBlock + '<div id="student-level" class="mt-1 inline-flex items-center bg-white/15 border border-white/25 text-white text-sm font-extrabold px-3 py-1 rounded-full">Level: Loading...</div>';
    html = html.replace(nameBlock, levelBlock);

    const levelScript = `
<script>
(function(){
  const LEVEL_SUPABASE_URL = "https://portal-bridge.ucmas-ambernath-pg.workers.dev";
  const LEVEL_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwYWt3Z3piYmp5d3pjY29haGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxOTAyMjQsImV4cCI6MjA3Nzc2NjIyNH0.VNjAhpbMzv9c19-IAg8UF2u28aIhh5OYCjAhcec9dRk";

  async function loadStudentLevel(){
    const levelEl = document.getElementById('student-level');
    try {
      if (!window.supabase) throw new Error('Database library unavailable');
      const levelClient = window.supabase.createClient(LEVEL_SUPABASE_URL, LEVEL_SUPABASE_ANON_KEY);
      const { data: { session } } = await levelClient.auth.getSession();
      if (!session) {
        if (levelEl) levelEl.textContent = 'Level: Not available';
        return;
      }

      const { data: profile, error } = await levelClient
        .from('profiles')
        .select('full_name,current_level,role,is_active')
        .eq('id', session.user.id)
        .single();

      if (error || !profile) throw error || new Error('Profile not found');
      if (profile.role !== 'student') return;

      if (profile.full_name) {
        const nameEl = document.getElementById('welcome-name');
        if (nameEl) nameEl.textContent = profile.full_name;
        sessionStorage.setItem('studentIdentifier', profile.full_name);
      }

      const level = Number(profile.current_level);
      if (Number.isInteger(level) && level >= 1 && level <= 8) {
        if (levelEl) levelEl.textContent = 'Level ' + level;
        sessionStorage.setItem('currentLevel', String(level));
      } else {
        if (levelEl) {
          levelEl.textContent = 'Level: Not Set';
          levelEl.classList.add('bg-red-500/30');
        }
        sessionStorage.removeItem('currentLevel');
      }
    } catch (err) {
      console.error('Could not load student level:', err);
      const cached = sessionStorage.getItem('currentLevel');
      if (levelEl) levelEl.textContent = cached ? ('Level ' + cached) : 'Level: Unable to load';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadStudentLevel);
  } else {
    loadStudentLevel();
  }
})();
<\/script>`;

    html = html.replace('</body>', levelScript + '</body>');

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = '<div class="loading">Unable to load practice dashboard. Please refresh the page.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
