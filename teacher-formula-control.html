<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Access - Li'l Champs</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Nunito,sans-serif;background:#f5f3ff}.formula-check:checked+span{border-color:#7c3aed;background:#ede9fe;color:#5b21b6}.formula-check:focus+span{outline:3px solid #ddd6fe}</style></head>
<body class="min-h-screen text-slate-800"><header class="bg-indigo-700 text-white shadow"><div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between gap-3"><div><h1 class="text-2xl font-black">Formula Access</h1><p class="text-indigo-100 text-sm font-bold">Unlock only formulas already taught in each batch</p></div><a href="teacher-dashboard.html" class="bg-white/15 px-4 py-2 rounded-xl font-black">Back</a></div></header>
<main class="max-w-6xl mx-auto p-4 py-7"><div id="loading" class="bg-white rounded-2xl p-8 text-center font-black text-indigo-600">Loading batches...</div><div id="denied" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-6 text-center font-black">Staff access required.</div><div id="app" class="hidden grid lg:grid-cols-[290px_1fr] gap-5"><aside class="bg-white rounded-2xl shadow p-4 h-fit"><div class="text-xs uppercase font-black text-gray-400 mb-3">Level 1 & 2 Batches</div><div id="batchList" class="space-y-2"></div></aside><section class="bg-white rounded-2xl shadow p-5"><div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 border-b pb-4"><div><div class="text-xs uppercase text-purple-500 font-black">Selected Batch</div><h2 id="batchTitle" class="text-2xl font-black">Choose a batch</h2><p id="batchMeta" class="text-sm text-gray-500 font-bold mt-1"></p></div><button id="saveBtn" disabled class="bg-purple-600 disabled:bg-gray-300 text-white rounded-xl px-5 py-3 font-black">Save Taught Formulas</button></div><div class="mt-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 p-3 text-sm font-bold">Tick every formula that has been taught. Previously taught formulas should remain ticked when you add the next weekly formulas.</div><div id="formulaGroups" class="mt-5 space-y-5"></div><div id="saveMessage" class="hidden mt-5 rounded-xl p-3 font-bold text-center"></div></section></div></main>
<script>
const SUPABASE_URL='https://portal-bridge.ucmas-ambernath-pg.workers.dev',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwYWt3Z3piYmp5d3pjY29haGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxOTAyMjQsImV4cCI6MjA3Nzc2NjIyNH0.VNjAhpbMzv9c19-IAg8UF2u28aIhh5OYCjAhcec9dRk',db=supabase.createClient(SUPABASE_URL,KEY);
const groups=[
['Small Friend +',[['sf_p4','+4 = +5 - 1'],['sf_p3','+3 = +5 - 2'],['sf_p2','+2 = +5 - 3'],['sf_p1','+1 = +5 - 4']]],
['Small Friend -',[['sf_m4','-4 = +1 - 5'],['sf_m3','-3 = +2 - 5'],['sf_m2','-2 = +3 - 5'],['sf_m1','-1 = +4 - 5']]],
['Big Friend +',[['bf_p9','+9 = -1 + 10'],['bf_p8','+8 = -2 + 10'],['bf_p7','+7 = -3 + 10'],['bf_p6','+6 = -4 + 10'],['bf_p5','+5 = -5 + 10'],['bf_p4','+4 = -6 + 10'],['bf_p3','+3 = -7 + 10'],['bf_p2','+2 = -8 + 10'],['bf_p1','+1 = -9 + 10']]],
['Big Friend -',[['bf_m9','-9 = -10 + 1'],['bf_m8','-8 = -10 + 2'],['bf_m7','-7 = -10 + 3'],['bf_m6','-6 = -10 + 4'],['bf_m5','-5 = -10 + 5'],['bf_m4','-4 = -10 + 6'],['bf_m3','-3 = -10 + 7'],['bf_m2','-2 = -10 + 8'],['bf_m1','-1 = -10 + 9']]],
['Mix +',[['mix_p6','Mix +6'],['mix_p7','Mix +7'],['mix_p8','Mix +8'],['mix_p9','Mix +9']]],
['Mix -',[['mix_m6','Mix -6'],['mix_m7','Mix -7'],['mix_m8','Mix -8'],['mix_m9','Mix -9']]]];
let batches=[],selected=null;const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verify(){const {data:{session}}=await db.auth.getSession();if(!session)return false;const {data}=await db.from('profiles').select('role,is_active').eq('id',session.user.id).maybeSingle();return data?.is_active!==false&&['admin','teacher'].includes(data?.role)}
function renderBatchList(){$('batchList').innerHTML=batches.length?batches.map((b,i)=>`<button data-i="${i}" class="batchBtn w-full text-left rounded-xl border p-3 ${selected===i?'border-purple-500 bg-purple-50':'border-gray-200'}"><div class="font-black">${esc(b.batch_name)}</div><div class="text-xs text-gray-500 font-bold">${b.student_count} students · ${(b.formula_ids||[]).length} formulas</div></button>`).join(''):'<div class="text-sm text-gray-400 font-bold">No assigned Level 1 or 2 batches.</div>';document.querySelectorAll('.batchBtn').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)))}
function renderGroups(){if(selected===null){$('formulaGroups').innerHTML='<div class="text-center text-gray-400 font-bold py-10">Select a batch to manage taught formulas.</div>';return}const unlocked=new Set(batches[selected].formula_ids||[]);$('formulaGroups').innerHTML=groups.map(([title,items])=>`<section><div class="flex items-center justify-between mb-2"><h3 class="font-black text-lg">${title}</h3><button class="groupToggle text-xs font-black text-purple-600" data-ids="${items.map(x=>x[0]).join(',')}">Select group</button></div><div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-2">${items.map(([id,label])=>`<label><input class="formula-check sr-only" type="checkbox" value="${id}" ${unlocked.has(id)?'checked':''}><span class="block border-2 border-gray-200 rounded-xl p-3 font-black cursor-pointer">${label}</span></label>`).join('')}</div></section>`).join('');document.querySelectorAll('.groupToggle').forEach(b=>b.onclick=()=>{const ids=b.dataset.ids.split(','),boxes=ids.map(id=>document.querySelector(`.formula-check[value="${id}"]`)),all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all)})}
function choose(i){selected=i;const b=batches[i];$('batchTitle').textContent=b.batch_name;$('batchMeta').textContent=`${b.student_count} active Level 1 & 2 students`;$('saveBtn').disabled=false;renderBatchList();renderGroups();$('saveMessage').classList.add('hidden')}
async function save(){const b=batches[selected],ids=[...document.querySelectorAll('.formula-check:checked')].map(x=>x.value);$('saveBtn').disabled=true;$('saveBtn').textContent='Saving...';const {error}=await db.rpc('staff_replace_batch_formula_access',{p_batch_name:b.batch_name,p_formula_ids:ids});$('saveBtn').disabled=false;$('saveBtn').textContent='Save Taught Formulas';const m=$('saveMessage');m.classList.remove('hidden');if(error){m.className='mt-5 rounded-xl p-3 font-bold text-center bg-red-50 text-red-700';m.textContent=error.message}else{b.formula_ids=ids;m.className='mt-5 rounded-xl p-3 font-bold text-center bg-green-50 text-green-700';m.textContent=`Saved. Students in ${b.batch_name} can now practise ${ids.length} taught formulas.`;renderBatchList()}}
async function init(){try{if(!await verify()){$('loading').classList.add('hidden');$('denied').classList.remove('hidden');return}const {data,error}=await db.rpc('staff_formula_batch_settings');if(error)throw error;batches=data||[];$('loading').classList.add('hidden');$('app').classList.remove('hidden');renderBatchList();renderGroups()}catch(error){$('loading').className='bg-red-50 border border-red-200 text-red-700 rounded-2xl p-6 text-center font-black';$('loading').textContent=`Unable to load batches: ${error?.message||'Please refresh and try again.'}`}}$('saveBtn').onclick=save;init();
</script></body></html>
