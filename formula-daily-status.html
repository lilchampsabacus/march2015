<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Daily Status - Li'l Champs</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Nunito,sans-serif;background:#f8fafc}.pill{display:inline-flex;padding:.3rem .65rem;border-radius:999px;font-size:.75rem;font-weight:900}</style></head>
<body><header class="bg-purple-700 text-white shadow"><div class="max-w-7xl mx-auto px-4 py-5 flex items-center justify-between gap-3"><div><h1 class="text-2xl font-black">Formula Daily Status</h1><p class="text-purple-100 text-sm font-bold">30-sum target, extra practice and Star of the Day</p></div><a href="teacher-dashboard.html" class="bg-white/15 px-4 py-2 rounded-xl font-black">Back</a></div></header>
<main class="max-w-7xl mx-auto p-4 py-6"><div class="bg-white rounded-2xl shadow p-4 grid sm:grid-cols-2 lg:grid-cols-4 gap-3"><label><span class="text-xs font-black uppercase text-gray-500">Date</span><input id="date" type="date" class="w-full mt-1 border rounded-xl px-3 py-2 font-bold"></label><label><span class="text-xs font-black uppercase text-gray-500">Batch</span><select id="batch" class="w-full mt-1 border rounded-xl px-3 py-2 font-bold"><option value="all">All Batches</option></select></label><label><span class="text-xs font-black uppercase text-gray-500">Status</span><select id="status" class="w-full mt-1 border rounded-xl px-3 py-2 font-bold"><option value="all">All</option><option value="completed">Completed</option><option value="in_progress">In Progress</option><option value="not_started">Not Started</option></select></label><label><span class="text-xs font-black uppercase text-gray-500">Search</span><input id="search" placeholder="Student name" class="w-full mt-1 border rounded-xl px-3 py-2 font-bold"></label></div>
<div id="loading" class="mt-5 bg-white rounded-2xl p-8 text-center font-black text-purple-600">Loading formula practice...</div><div id="app" class="hidden"><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5"><div class="bg-white rounded-xl shadow p-4 border-t-4 border-slate-400"><div class="text-sm font-bold text-gray-500">Students</div><div id="total" class="text-3xl font-black">0</div></div><div class="bg-white rounded-xl shadow p-4 border-t-4 border-green-500"><div class="text-sm font-bold text-gray-500">Completed 30</div><div id="completed" class="text-3xl font-black text-green-700">0</div></div><div class="bg-white rounded-xl shadow p-4 border-t-4 border-amber-500"><div class="text-sm font-bold text-gray-500">In Progress</div><div id="progress" class="text-3xl font-black text-amber-700">0</div></div><div class="bg-white rounded-xl shadow p-4 border-t-4 border-red-500"><div class="text-sm font-bold text-gray-500">Not Started</div><div id="notStarted" class="text-3xl font-black text-red-700">0</div></div></div>
<section class="bg-gradient-to-r from-amber-50 to-yellow-100 border border-amber-200 rounded-2xl p-5 mt-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><div class="text-xs uppercase font-black text-amber-700">Formula Practice Star</div><div id="starName" class="text-2xl font-black text-slate-800 mt-1">No eligible student yet</div><div id="starMeta" class="text-sm font-bold text-gray-600"></div></div><button id="starCardBtn" class="bg-amber-500 text-white px-5 py-3 rounded-xl font-black">Download Batch Cards</button></section>
<div id="batchCards" class="grid md:grid-cols-2 xl:grid-cols-3 gap-3 mt-5"></div><div class="bg-white rounded-2xl shadow overflow-x-auto mt-5"><table class="w-full min-w-[950px] text-sm"><thead class="bg-purple-700 text-white"><tr><th class="p-3 text-left">Student</th><th class="p-3 text-left">Batch</th><th class="p-3">Status</th><th class="p-3">Sums</th><th class="p-3">Sessions</th><th class="p-3">Correct</th><th class="p-3">Accuracy</th><th class="p-3">Wrong</th><th class="p-3">Time</th><th class="p-3">Unlocked</th></tr></thead><tbody id="rows" class="divide-y"></tbody></table></div></div></main>
<canvas id="cardCanvas" width="1080" height="1350" class="hidden"></canvas><script>
const SUPABASE_URL='https://portal-bridge.ucmas-ambernath-pg.workers.dev',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwYWt3Z3piYmp5d3pjY29haGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxOTAyMjQsImV4cCI6MjA3Nzc2NjIyNH0.VNjAhpbMzv9c19-IAg8UF2u28aIhh5OYCjAhcec9dRk',db=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id);let all=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),batchName=r=>String(r.batch_name||'').trim(),state=r=>Number(r.completed_sessions)>0?'completed':Number(r.sums_practised)>0?'in_progress':'not_started',accuracy=r=>Number(r.sums_practised)?Math.round(Number(r.correct_sums)/Number(r.sums_practised)*100):0,fmt=s=>`${Math.floor(Number(s||0)/60)}:${String(Number(s||0)%60).padStart(2,'0')}`,indiaDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function pill(s){return s==='completed'?'<span class="pill bg-green-100 text-green-700">Completed</span>':s==='in_progress'?'<span class="pill bg-amber-100 text-amber-700">In Progress</span>':'<span class="pill bg-red-100 text-red-700">Not Started</span>'}
function filtered(){const b=$('batch').value,s=$('status').value,q=$('search').value.toLowerCase();return all.filter(r=>(b==='all'||batchName(r)===b)&&(s==='all'||state(r)===s)&&(!q||String(r.student_name).toLowerCase().includes(q)))}
function stars(rows){return rows.filter(r=>Number(r.completed_sessions)>0&&accuracy(r)>=80).sort((a,b)=>Number(b.correct_sums)-Number(a.correct_sums)||accuracy(b)-accuracy(a)||Number(a.duration_seconds)-Number(b.duration_seconds))}
function render(){const rows=filtered();$('total').textContent=rows.length;$('completed').textContent=rows.filter(r=>state(r)==='completed').length;$('progress').textContent=rows.filter(r=>state(r)==='in_progress').length;$('notStarted').textContent=rows.filter(r=>state(r)==='not_started').length;const star=stars(rows)[0];$('starName').textContent=star?star.student_name:'No eligible student yet';$('starMeta').textContent=star?`${star.correct_sums} correct · ${accuracy(star)}% accuracy · ${star.sums_practised} sums`:'';$('rows').innerHTML=rows.length?rows.map(r=>`<tr class="hover:bg-purple-50"><td class="p-3 font-black">${esc(r.student_name)}</td><td class="p-3 font-bold text-indigo-700">${esc(batchName(r)||'Not assigned')}</td><td class="p-3 text-center">${pill(state(r))}</td><td class="p-3 text-center font-black">${r.sums_practised}/30${Number(r.sums_practised)>30?` <span class="text-xs text-purple-600">(+${Number(r.sums_practised)-30})</span>`:''}</td><td class="p-3 text-center font-bold">${r.completed_sessions}</td><td class="p-3 text-center font-bold text-green-700">${r.correct_sums}</td><td class="p-3 text-center font-black">${accuracy(r)}%</td><td class="p-3 text-center font-bold text-red-600">${r.wrong_sums}</td><td class="p-3 text-center font-bold">${fmt(r.duration_seconds)}</td><td class="p-3 text-center font-bold">${r.unlocked_formula_count}</td></tr>`).join(''):'<tr><td colspan="10" class="p-8 text-center text-gray-400 font-bold">No students match these filters.</td></tr>';renderBatchCards()}
function renderBatchCards(){const names=[...new Set(all.map(batchName).filter(Boolean))].sort();$('batchCards').innerHTML=names.map(n=>{const rows=all.filter(r=>batchName(r)===n),done=rows.filter(r=>state(r)==='completed'),star=stars(rows)[0];return `<article class="bg-white border rounded-2xl p-4"><div class="flex justify-between"><div><div class="text-xs uppercase text-gray-400 font-black">Batch</div><div class="text-xl font-black text-purple-700">${esc(n)}</div></div><div class="text-right"><div class="text-2xl font-black text-green-700">${done.length}/${rows.length}</div><div class="text-xs font-bold text-gray-500">Completed</div></div></div><div class="mt-3 text-sm font-bold text-amber-700">Star: ${star?esc(star.student_name):'Not yet'}</div><button class="batchDownload mt-3 w-full bg-purple-100 text-purple-700 rounded-xl py-2 font-black" data-batch="${esc(n)}">Download Image</button></article>`}).join('');document.querySelectorAll('.batchDownload').forEach(b=>b.onclick=()=>downloadCard(b.dataset.batch))}
async function load(){const {data,error}=await db.rpc('staff_formula_daily_status',{p_date:$('date').value});if(error){$('loading').textContent=error.message;return}all=data||[];const keep=$('batch').value,names=[...new Set(all.map(batchName).filter(Boolean))].sort();$('batch').innerHTML='<option value="all">All Batches</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');if(names.includes(keep))$('batch').value=keep;$('loading').classList.add('hidden');$('app').classList.remove('hidden');render()}
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function cardBlob(batch){const canvas=$('cardCanvas'),c=canvas.getContext('2d'),rows=all.filter(r=>batchName(r)===batch),done=rows.filter(r=>state(r)==='completed').sort((a,b)=>String(a.student_name).localeCompare(String(b.student_name))),star=stars(rows)[0],g=c.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#ede9fe');g.addColorStop(1,'#fef3c7');c.fillStyle=g;c.fillRect(0,0,1080,1350);c.fillStyle='#5b21b6';c.fillRect(0,0,1080,270);c.fillStyle='#fff';c.font='900 46px Nunito,Arial';c.fillText("Li'l Champs Abacus Academy",60,90);c.font='800 28px Nunito,Arial';c.fillStyle='#ddd6fe';c.fillText('AMBERNATH',60,135);c.fillStyle='#fff';c.font='900 55px Nunito,Arial';c.fillText('FORMULA PRACTICE STARS',60,220);c.fillStyle='#fff';rounded(c,55,310,970,190,30);c.fillStyle='#111827';c.font='900 55px Nunito,Arial';c.fillText(`Batch ${batch}`,90,380);c.fillStyle='#6b7280';c.font='700 27px Nunito,Arial';c.fillText($('date').value,90,425);c.textAlign='right';c.fillStyle='#15803d';c.font='900 65px Nunito,Arial';c.fillText(`${done.length}/${rows.length}`,980,390);c.font='800 22px Nunito,Arial';c.fillStyle='#6b7280';c.fillText('COMPLETED 30 SUMS',980,430);c.textAlign='left';c.fillStyle='#fff7ed';rounded(c,55,535,970,185,30);c.fillStyle='#b45309';c.font='900 25px Nunito,Arial';c.fillText('FORMULA PRACTICE STAR',90,585);c.fillStyle='#111827';c.font='900 43px Nunito,Arial';c.fillText(star?star.student_name:'No eligible student yet',90,640);c.fillStyle='#6b7280';c.font='800 25px Nunito,Arial';c.fillText(star?`${star.correct_sums} correct • ${accuracy(star)}% accuracy • ${star.sums_practised} sums`:'Minimum 30 sums and 80% accuracy required',90,682);c.fillStyle='#fff';rounded(c,55,760,970,430,30);c.fillStyle='#166534';c.font='900 30px Nunito,Arial';c.fillText('Students who completed today',90,815);c.fillStyle='#1f2937';c.font='800 27px Nunito,Arial';done.slice(0,12).forEach((r,i)=>{const col=i>=6?1:0,pos=i%6;c.fillText(`✓  ${r.student_name}`,90+col*465,875+pos*48)});if(!done.length){c.fillStyle='#9ca3af';c.fillText('No completed practice yet.',90,885)}c.fillStyle='#5b21b6';rounded(c,55,1230,970,75,24);c.fillStyle='#fff';c.font='900 27px Nunito,Arial';c.textAlign='center';c.fillText('Practise more. Keep accuracy above 80%.',540,1278);c.textAlign='left';return new Promise(res=>canvas.toBlob(res,'image/png'))}
async function downloadCard(batch){const blob=await cardBlob(batch),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=`formula-practice-${$('date').value}-${batch.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function verify(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return false}const {data}=await db.from('profiles').select('role,is_active').eq('id',session.user.id).maybeSingle();return data?.is_active!==false&&['admin','teacher'].includes(data?.role)}
$('date').value=indiaDate();$('date').onchange=load;$('batch').onchange=render;$('status').onchange=render;$('search').oninput=render;$('starCardBtn').onclick=()=>{document.querySelectorAll('.batchDownload').forEach(b=>b.click())};(async()=>{if(await verify())load();else $('loading').textContent='Staff access required.'})();
</script></body></html>
