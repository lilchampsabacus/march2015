<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Updates | Li'l Champs</title><script src="assets/vendor/supabase-js-2.118.0.js"></script><link rel="stylesheet" href="class-updates.css?v=1"><style>body{background:#f0f4fc;margin:0;padding:20px}</style></head><body><p style="max-width:1000px;margin:0 auto 20px"><a href="teacher-dashboard.html">← Teacher dashboard</a></p><main id="classUpdates"><div class="cu-head"><h2>Class Updates</h2><button id="updateRefresh" type="button">Refresh</button></div><p>Publish completed weeks, book pages and upcoming tests for your batch. Updates appear on the student dashboard.</p><p id="updateStatus" role="status">Loading…</p><form id="updateForm"><div class="cu-grid"><div ><label for="updateBatch">Batch</label><select required id="updateBatch"></select></div><div ><label for="updateLevel">Level</label><input id="updateLevel" type="number" min="1" max="10" required></div><div ><label for="updateDate">Class / notice date</label><input id="updateDate" type="date" required></div><div ><label for="updateKind">Update type</label><select id="updateKind"><option value="completed">Completed class</option><option value="sample_test">Sample test</option><option value="final_exam">Final exam</option><option value="notice">General notice</option></select></div><div ><label for="updateWeek">Completed week</label><input id="updateWeek" type="number" min="1" max="100"></div><div ><label for="updateBook">Book</label><input id="updateBook" placeholder="Book A" maxlength="80"></div><div ><label for="updatePages">Completed pages</label><input id="updatePages" placeholder="23, 24, 25, 26, 27, 28" maxlength="300"></div><div id=eventField><label for="updateEvent">Test / exam date</label><input id="updateEvent" type="date"></div></div><label for="updateMessage">Message for parents (optional for class updates)</label><textarea id="updateMessage" rows="3" maxlength="2000" placeholder="Please revise the completed pages before the next class."></textarea><p><button id="updateSave" type="submit">Publish update</button> <button id="updateCancel" type="button">New update / Cancel edit</button></p></form><h2>Published updates</h2><div id="updateList"></div></main><script src="class-updates.js?v=1"></script></body></html>
