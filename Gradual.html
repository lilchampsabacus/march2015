<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="elegant-theme.css">
    <script src="gamify.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gradual Practice - Li'l Champs Abacus Academy</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;      
            position: fixed;       
            touch-action: none;    
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#e0f2fe 2px, transparent 2px);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1;
            overflow-y: auto;      
            -webkit-overflow-scrolling: touch; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen-container {
            max-width: 480px;
            margin: auto;
            padding: 1.5rem;
            width: 100%;
        }

        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 5px 15px -5px rgba(0, 0, 0, 0.04);
        }

        .feedback-correct {
            border-color: #10B981 !important; 
            background-color: #ECFDF5; 
        }
        .feedback-wrong {
            border-color: #EF4444 !important; 
            background-color: #FEF2F2; 
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4f46e5; /* Indigo 600 */
            color: white;
            border: none;
            border-radius: 0.75rem;
            transition: all 0.2s;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .mode-btn:hover { background-color: #4338ca; transform: translateY(-1px); }

        #problem-container {
            font-size: 3.5rem; 
            margin: 2rem 0;
            font-weight: 800; 
            color: #1e1b4b; /* Indigo 950 */
            text-align: center; 
            padding: 1.5rem;
            background-color: #f8fafc; 
            border-radius: 1rem;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
        }

        #user-answer {
            text-align: center !important;
            font-size: 2rem !important;
            width: 100% !important;
            padding: 1rem !important;
            border: 4px solid #e2e8f0 !important;
            border-radius: 1rem !important;
            font-weight: 800;
            transition: all 0.2s;
        }

        #step-counter {
            font-size: 0.9rem;
            color: #64748b; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 800;
        }
    
/* Built-in practice keyboard */
*{box-sizing:border-box}
html,body{touch-action:manipulation}
.practice-keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;width:100%}
.practice-keypad button{min-height:44px;border:1px solid #c7d2fe;border-radius:10px;background:#eef2ff;color:#312e81;font-size:1.3rem;font-weight:800;touch-action:manipulation;cursor:pointer}
.practice-keypad button:active{background:#c7d2fe}
.practice-keypad .key-enter{grid-column:1/-1;background:#4f46e5;color:white}
.practice-keypad button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
body.keypad-solving{height:100dvh;inset:0}
body.keypad-solving>header,body.keypad-solving>footer,body.keypad-solving main h2,body.keypad-solving main a{display:none}
body.keypad-solving main{padding:8px!important;min-height:0;overflow:auto}
body.keypad-solving .screen-container{max-width:620px;padding:0;margin:auto;width:100%}
body.keypad-solving .card{padding:12px}
body.keypad-solving #problem-container{font-size:clamp(1.6rem,5vw,3rem);padding:12px;margin:10px 0}
body.keypad-solving #user-answer,body.keypad-solving #answerInput,body.keypad-solving #answer-input{padding:8px!important;font-size:1.6rem!important;min-height:44px}
body.keypad-solving #practiceScreen>div:first-of-type{padding:10px;margin-bottom:10px}
body.keypad-solving #currentNumber{font-size:clamp(2rem,7vw,3rem)}
body.keypad-solving #test-area{max-width:760px;margin:auto}
body.keypad-solving #test-area>div{padding:10px;margin-bottom:8px;margin-top:0}
body.keypad-solving #sum-display{font-size:clamp(1rem,3.7vw,1.65rem);overflow-wrap:anywhere}
body.keypad-solving #submit-button{display:none}
body.keypad-solving #test-area>div:first-child{position:static}
body.keypad-solving #test-area>div:last-child{margin-top:0}
body.keypad-solving #status-message,body.keypad-solving #answerFeedback{margin-top:6px;min-height:20px}
@media (max-height:600px) and (min-width:600px){
 body.keypad-solving .screen-container{max-width:900px}
 body.keypad-solving #practiceScreen,body.keypad-solving #exercise-screen{display:grid!important;grid-template-columns:1fr 1fr;gap:6px 20px}
 body.keypad-solving #practiceScreen>*:not(.practice-keypad),body.keypad-solving #exercise-screen>*:not(.practice-keypad){grid-column:1}
 body.keypad-solving .practice-keypad{grid-column:2;grid-row:1/7;align-self:center}
 body.keypad-solving #test-area{max-width:900px}
 body.keypad-solving #test-area>div:nth-child(2)>div{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
 body.keypad-solving #test-area h4,body.keypad-solving #sum-display,body.keypad-solving #test-area .h-0\\.5,body.keypad-solving #test-area .flex-col{grid-column:1}
 body.keypad-solving #test-area .practice-keypad{grid-column:2;grid-row:1/6}
}

</style>
</head>
<body oncontextmenu="return false;">
    <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-10 flex-none">
        <h1 class="text-2xl font-extrabold text-center tracking-wide">Li'l Champs Abacus Academy Ambernath</h1>
    </header>

    <main>
        <h2 class="text-3xl font-extrabold text-blue-900 mb-6 text-center">Gradual Addition/Subtraction Practice</h2>
        <div class="screen-container">
            <div class="card">
                
                <div id="selection-screen">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">Select Practice Mode</h2>
                    <button class="mode-btn" onclick="startPractice('addition')">➕ Gradual Addition (1+2+3...)</button>
                    <button class="mode-btn" onclick="startPractice('subtraction')">➖ Gradual Subtraction (100-99...)</button>
                </div>

                <div id="exercise-screen" style="display: none;" class="text-center">
                    <div id="step-counter">Step 1 of 100</div>
                    <div id="problem-container">0 + 1</div>
                    
                    <label for="user-answer" class="block text-sm font-bold text-gray-500 mb-2 uppercase">Enter Your Total</label>
                    <input type="text" inputmode="none" readonly id="user-answer" placeholder="?" autofocus autocomplete="off">
                    
                    <p id="status-message" class="min-h-[2.5rem] font-bold mt-4 text-sm"></p>
                </div>

                <div id="report-screen" style="display: none;">
                    <div class="text-center mb-6">
                        <div class="bg-green-100 text-green-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">Mission Complete!</h2>
                    </div>

                    <div class="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-100">
                        <p class="text-sm flex justify-between"><strong>Student:</strong> <span id="report-name" class="font-bold text-indigo-600"></span></p>
                        <p class="text-sm flex justify-between"><strong>Mode:</strong> <span id="report-mode" class="font-bold"></span></p>
                        <p class="text-sm flex justify-between"><strong>Time Taken:</strong> <span id="report-time" class="font-bold text-indigo-600"></span></p>
                        <p class="text-sm flex justify-between text-gray-400 mt-2 italic"><span id="report-datetime"></span></p>
                    </div>

                    <button onclick="window.location.reload()" class="mode-btn mt-6">Restart Practice</button>
                </div>
            </div>

            <div class="w-full text-center mt-8 flex-none">
                <a href="plus_minus.html" class="text-indigo-600 hover:text-indigo-800 font-bold underline text-sm uppercase tracking-wider">
                    &larr; Back to Plus Minus
                </a>
            </div>
        </div>
    </main>
    
    <footer class="bg-white text-center p-6 mt-auto border-t border-gray-200 flex-none">
        <p class="text-sm text-gray-500">Developed by: Practice Buddy Pvt Ltd</p>
    </footer>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = "https://portal-bridge.ucmas-ambernath-pg.workers.dev";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwYWt3Z3piYmp5d3pjY29haGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxOTAyMjQsImV4cCI6MjA3Nzc2NjIyNH0.VNjAhpbMzv9c19-IAg8UF2u28aIhh5OYCjAhcec9dRk";
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let studentIdentifier = sessionStorage.getItem('studentIdentifier');
        let studentName = studentIdentifier ? studentIdentifier.split('@')[0].split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ') : 'Student'; 

        if (!studentIdentifier) { window.location.href = 'index.html'; }

        const TOTAL_STEPS = 100;
        let currentStep = 0, currentResult = 0, mode = '', startTime = null, expectedAnswer = 0;
        
        const selectionScreen = $('selection-screen'), exerciseScreen = $('exercise-screen'), reportScreen = $('report-screen');
        const problemContainer = $('problem-container'), stepCounter = $('step-counter'), userAnswerInput = $('user-answer'), statusMessage = $('status-message');

        function $(id) { return document.getElementById(id); }

        function startPractice(selectedMode) {
            mode = selectedMode; currentStep = 0; startTime = Date.now();
            if (mode === 'addition') { currentResult = 0; } 
            else { currentResult = 5050; }
            selectionScreen.style.display = 'none'; exerciseScreen.style.display = 'block';
            nextProblem();
        }

        function nextProblem() {
            currentStep++;
            if (currentStep > TOTAL_STEPS) return generateReport();
            
            let nextNumber = (mode === 'addition') ? currentStep : (TOTAL_STEPS - (currentStep - 1));
            let operator = (mode === 'addition') ? '+' : '-';
            
            expectedAnswer = (mode === 'addition') ? currentResult + nextNumber : currentResult - nextNumber;
            
            stepCounter.textContent = `Step ${currentStep} of ${TOTAL_STEPS}`;
            problemContainer.textContent = `${currentResult} ${operator} ${nextNumber}`;
            userAnswerInput.value = ''; userAnswerInput.disabled = false;
            userAnswerInput.classList.remove('feedback-correct', 'feedback-wrong');
            statusMessage.textContent = '';
            userAnswerInput.focus();
        }

        function checkAnswer() {
            if (userAnswerInput.disabled || exerciseScreen.style.display === 'none') return;
            const val = parseInt(userAnswerInput.value);
            if (isNaN(val)) return;

            if (val === expectedAnswer) {
                userAnswerInput.classList.add('feedback-correct');
                statusMessage.textContent = '✅ CORRECT! Next step...';
                statusMessage.className = 'min-h-[2.5rem] font-bold mt-4 text-sm text-green-600';
                currentResult = expectedAnswer;
                userAnswerInput.disabled = true;
                setTimeout(() => { if (currentStep < TOTAL_STEPS) nextProblem(); else generateReport(); }, 400);
            } else {
                userAnswerInput.classList.add('feedback-wrong');
                statusMessage.textContent = '❌ TRY AGAIN';
                statusMessage.className = 'min-h-[2.5rem] font-bold mt-4 text-sm text-red-600';
                userAnswerInput.value = ''; 
            }
        }

        userAnswerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.repeat && !userAnswerInput.disabled) { e.preventDefault(); checkAnswer(); }
        });

        async function savePracticeToSupabase(practiceType, stepsCompleted) {
            try {
                const { data, error } = await supabase
                    .from('dailypractice')
                    .insert([
                        {
                            student_name: studentName,
                            practice_type: practiceType,
                            steps_completed: stepsCompleted,
                            practice_time: new Date().toISOString()
                        }
                    ]);

                if (error) {
                    console.error('Error saving to Supabase:', error);
                } else {
                    console.log('Practice saved successfully!');
                }
            } catch (err) {
                console.error('Exception saving to Supabase:', err);
            }
        }

        function generateReport() {
              const totalSec = Math.round((Date.now() - startTime) / 1000);
              const practiceType = mode === 'addition' ? 'Gradual Addition' : 'Gradual Subtraction';
              
              // Save to Supabase
              savePracticeToSupabase(practiceType, TOTAL_STEPS);
              
              $('report-name').textContent = studentName;
              $('report-mode').textContent = practiceType;
              $('report-time').textContent = `${Math.floor(totalSec / 60)}m ${totalSec % 60}s`;
              $('report-datetime').textContent = new Date().toLocaleString();
              exerciseScreen.style.display = 'none'; reportScreen.style.display = 'block';
        }
    </script>

<script>
(function(){
 const input=document.getElementById('user-answer');
 const screen=document.getElementById('exercise-screen');
 const keypad=document.createElement('div');
 keypad.className='practice-keypad';
 keypad.setAttribute('role','group');keypad.setAttribute('aria-label','Number keyboard');
 ['1','2','3','4','5','6','7','8','9','Clear','0','⌫','Enter'].forEach(key=>{
  const button=document.createElement('button');button.type='button';button.textContent=key;
  button.setAttribute('aria-label',key==='⌫'?'Backspace':key);
  if(key==='Enter') button.className='key-enter';
  button.addEventListener('click',()=>act(key));keypad.appendChild(button);
 });
 input.parentElement.insertAdjacentElement('afterend',keypad);
 if('user-answer'!=='answer-input') input.insertAdjacentElement('afterend',keypad);
 function active(){return !screen.classList.contains('hidden')&&screen.style.display!=='none';}
 let lastSubmit=0;
 function act(key){
  if(!active()||input.disabled)return;
  if(key==='Enter'){
   const now=Date.now();if(now-lastSubmit<450)return;lastSubmit=now;
   checkAnswer();
  }else{
   if(key==='Clear')input.value='';
   else if(key==='⌫')input.value=input.value.slice(0,-1);
   else if(input.value.length<16)input.value+=key;
   input.dispatchEvent(new Event('input',{bubbles:true}));
  }
 }
 document.addEventListener('keydown',event=>{
  if(!active()||event.ctrlKey||event.metaKey||event.altKey)return;
  const key=event.key;
  if(/^\d$/.test(key)||['Enter','Backspace','Delete','Escape'].includes(key)){
   event.preventDefault();event.stopImmediatePropagation();
   if(event.repeat)return;
   act(key==='Backspace'?'⌫':['Delete','Escape'].includes(key)?'Clear':key);
  }
 },true);
 function sync(){document.body.classList.toggle('keypad-solving',active());}
 new MutationObserver(sync).observe(screen,{attributes:true,attributeFilter:['class','style']});sync();
})();
</script>

</body>
</html>
